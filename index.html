const QueueContext = createContext();

// Hospital Web Audio API Synthesizer (Ding-Dong Chime)
function playHospitalChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();

    // High Tone (E5 - 659Hz)
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(659.25, ctx.currentTime);
    gain1.gain.setValueAtTime(0.28, ctx.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.start(ctx.currentTime);
    osc1.stop(ctx.currentTime + 0.6);

    // Low Tone (C5 - 523Hz)
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(523.25, ctx.currentTime + 0.2);
    gain2.gain.setValueAtTime(0.32, ctx.currentTime + 0.2);
    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.start(ctx.currentTime + 0.2);
    osc2.stop(ctx.currentTime + 0.9);
  } catch (e) {
    console.warn('Audio chime notice:', e);
  }
}

// Emergency Attention Alert Chime
function playEmergencyAlertSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(1046, ctx.currentTime + 0.15);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.3);
    osc.frequency.setValueAtTime(1046, ctx.currentTime + 0.45);
    gain.gain.setValueAtTime(0.22, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.65);
  } catch (e) {
    console.warn('Emergency audio notice:', e);
  }
}

const HISTORICAL_PATIENT_RECORDS = [
  { phone: "9811223344", name: "Meena Devi", lastVisitDate: "15-Oct-2026", daysAgo: 4, previousDiagnosis: "Acute Viral Pyrexia" },

function QueueProvider({ children }) {
  const [patients, setPatients] = useState(() => {
    const saved = localStorage.getItem('apex_patients_db');
    return saved ? JSON.parse(saved) : INITIAL_PATIENTS;
  });

  const [doctorStatus, setDoctorStatus] = useState(() => {
    return localStorage.getItem('apex_doctor_status') || 'in_cabin';
  });

  const [mySession, setMySession] = useState(() => {
    const saved = localStorage.getItem('apex_my_session');
    return saved ? JSON.parse(saved) : null;
  });

  const [auditLogs, setAuditLogs] = useState(() => [
    { id: 1, text: "Token #01 Suresh Gupta consultation completed (Rx sent to Pharmacy)", time: "10:15 AM", type: "success" },
    { id: 2, text: "Token #02 Meena Devi 7-Day Free Follow-up checked in (₹0 Fee)", time: "10:18 AM", type: "info" },
    { id: 3, text: "Token #03 Rajesh Kumar called into Dr. Cabin", time: "10:35 AM", type: "warning" },
    { id: 4, text: "Token #05 Pawan Suthar digital token registered via web", time: "10:55 AM", type: "info" }
  ]);

  // Real-time Cross-Tab Broadcast Channel (Zero-Latency Inter-Process Sync)
  useEffect(() => {
    let channel = null;
    try {
      if (typeof window !== 'undefined' && 'BroadcastChannel' in window) {
        channel = new BroadcastChannel('apex_clinic_realtime_bus');
        channel.onmessage = (event) => {
          const { type, payload } = event.data || {};
          if (type === 'SYNC_PATIENTS') {
            setPatients(payload);
          } else if (type === 'SYNC_DOCTOR_STATUS') {
            setDoctorStatus(payload);
          } else if (type === 'CHIME_CALL') {
            playHospitalChime();
          } else if (type === 'EMERGENCY_ALERT') {
            playEmergencyAlertSound();
          } else if (type === 'NEW_AUDIT_LOG') {
            setAuditLogs(prev => [payload, ...prev.slice(0, 19)]);
          }
        };
      }
    } catch (e) {
      console.warn('BroadcastChannel initialization:', e);
    }

    const handleStorage = (e) => {
      if (e.key === 'apex_patients_db' && e.newValue) {
        setPatients(JSON.parse(e.newValue));
      }
      if (e.key === 'apex_doctor_status' && e.newValue) {
        setDoctorStatus(e.newValue);
      }
    };
    window.addEventListener('storage', handleStorage);

    return () => {
      if (channel) channel.close();
      window.removeEventListener('storage', handleStorage);
    };
  }, []);

  const broadcastEvent = (type, payload) => {
    try {
      if (typeof window !== 'undefined' && 'BroadcastChannel' in window) {
        const bus = new BroadcastChannel('apex_clinic_realtime_bus');
        bus.postMessage({ type, payload, timestamp: Date.now() });
        bus.close();
      }
    } catch (e) {
      console.warn('Broadcast failed:', e);
    }
  };

  const addAuditLog = (text, type = "info") => {
    const newLog = {
      id: Date.now(),
      text,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      type
    };
    setAuditLogs(prev => [newLog, ...prev.slice(0, 19)]);
    broadcastEvent('NEW_AUDIT_LOG', newLog);
  };

  const syncPatientsState = (newPatients) => {
    setPatients(newPatients);
    localStorage.setItem('apex_patients_db', JSON.stringify(newPatients));
    broadcastEvent('SYNC_PATIENTS', newPatients);
  };

  const handleSetDoctorStatus = (status) => {
    setDoctorStatus(status);
    localStorage.setItem('apex_doctor_status', status);
    broadcastEvent('SYNC_DOCTOR_STATUS', status);
    addAuditLog(`Doctor marked status: ${status === 'in_cabin' ? 'In Cabin' : status === 'break' ? 'Tea Break' : 'Shift Off'}`, 'info');
  };

  const currentPatient = patients.find(p => p.status === 'serving') || null;
  const servingToken = currentPatient ? currentPatient.token : 3;

  // 1. Call specific patient into Dr Cabin
  const callPatient = (patientId) => {
    playHospitalChime();
    broadcastEvent('CHIME_CALL', { patientId });

    let calledPat = null;
    const updated = patients.map(p => {
      if (p.id === patientId) {
        calledPat = p;
        return { ...p, status: 'serving' };
      }
      if (p.status === 'serving') {
        return { ...p, status: 'completed' };
      }
      return p;
    });

    syncPatientsState(updated);
    if (calledPat) {
      addAuditLog(`Token #${calledPat.token < 10 ? '0' + calledPat.token : calledPat.token} (${calledPat.name}) called inside Dr. Cabin`, 'warning');
    }
  };

  // 2. Complete consultation
  const completePatient = (patientId) => {
    let completedPat = null;
    const updated = patients.map(p => {
      if (p.id === patientId) {
        completedPat = p;
        return { ...p, status: 'completed' };
      }
      return p;
    });
    syncPatientsState(updated);
    if (completedPat) {
      addAuditLog(`Token #${completedPat.token < 10 ? '0' + completedPat.token : completedPat.token} consultation finished`, 'success');
    }
  };

  // 3. Skip patient
  const skipPatient = (patientId) => {
    let skippedPat = null;
    const updated = patients.map(p => {
      if (p.id === patientId) {
        skippedPat = p;
        return { ...p, status: 'skipped' };
      }
      return p;
    });
    syncPatientsState(updated);
    if (skippedPat) {
      addAuditLog(`Token #${skippedPat.token < 10 ? '0' + skippedPat.token : skippedPat.token} marked as skipped`, 'info');
    }
  };

  // 4. Call next waiting patient in line (Emergency patients get absolute priority)
  const callNextInLine = () => {
    // Sort waiting patients: Emergency first, then ascending token
    const waiting = patients.filter(p => p.status === 'waiting');
    if (waiting.length === 0) {
      alert("No more patients currently waiting in queue!");
      return;
    }

    const nextWaiting = waiting.sort((a, b) => {
      if (a.isEmergency && !b.isEmergency) return -1;
      if (!a.isEmergency && b.isEmergency) return 1;
      return a.token - b.token;
    })[0];

    callPatient(nextWaiting.id);
  };

  // 5. Emergency / VIP Priority Bump
  const emergencyBumpPatient = (patientId) => {
    playEmergencyAlertSound();
    broadcastEvent('EMERGENCY_ALERT', { patientId });

    let bumpedPat = null;
    const updated = patients.map(p => {
      if (p.id === patientId) {
        bumpedPat = p;
        return { ...p, isEmergency: true };
      }
      return p;
    });

    syncPatientsState(updated);
    if (bumpedPat) {
      addAuditLog(`EMERGENCY BUMP: Token #${bumpedPat.token < 10 ? '0' + bumpedPat.token : bumpedPat.token} (${bumpedPat.name}) promoted to Priority #1 Triage!`, 'emergency');
    }
  };

  // 6. Check 7-Day Free Follow-up Eligibility
  const check7DayReview = (phone) => {
    if (!phone) return null;
    const cleanPhone = phone.replace(/\D/g, '').slice(-10);
    // Check in past directory + completed patients today
    const foundPast = HISTORICAL_PATIENT_RECORDS.find(r => r.phone.endsWith(cleanPhone));
    if (foundPast) {
      return {
        isEligible: true,
        patientName: foundPast.name,
        daysAgo: foundPast.daysAgo,
        lastVisitDate: foundPast.lastVisitDate,
        previousDiagnosis: foundPast.previousDiagnosis
      };
    }
    const foundCompleted = patients.find(p => p.status === 'completed' && p.phone && p.phone.endsWith(cleanPhone));
    if (foundCompleted) {
      return {
        isEligible: true,
        patientName: foundCompleted.name,
        daysAgo: 0,
        lastVisitDate: 'Today',
        previousDiagnosis: foundCompleted.diagnosis || foundCompleted.symptom
      };
    }
    return null;
  };

  // 7. Add Walk-In Patient (with 7-day review & emergency flags)
  const addWalkInPatient = ({ name, age, gender, phone, symptom, isEmergency = false, isReview = false, vitals = null }) => {
    const nextToken = patients.reduce((max, p) => Math.max(max, p.token), 0) + 1;
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const newPatient = {
      id: `pat_${Date.now()}`,
      token: nextToken,
      name: name.trim(),
      age: parseInt(age, 10),
      gender,
      phone: phone || "Walk-In Desk",
      symptom: symptom || "General Consultation",
      shift: "Morning",
      source: "Walk-In",
      status: "waiting",
      time: timeStr,
      registeredAt: Date.now(),
      isEmergency: !!isEmergency,
      isReview: !!isReview,
      consultationFee: isReview ? 0 : 600,
      vitals: vitals || { bp: "120/80", pulse: "74", temp: "98.6", spo2: "99", weight: "65" },
      diagnosis: "",
      prescription: [],
      labTests: [],
      advice: "",
      pharmacyStatus: "not_required",
      pharmacyTotal: 0
    };

    const updated = [...patients, newPatient];
    syncPatientsState(updated);
    addAuditLog(`Token #${nextToken < 10 ? '0' + nextToken : nextToken} (${name}) registered at Walk-in counter ${isReview ? '(7-Day Free Review)' : ''}`, 'info');
    return newPatient;
  };

  // 8. Book Online Token
  const bookOnlineToken = ({ name, age, gender, symptom, shift, phone }) => {
    const nextToken = patients.reduce((max, p) => Math.max(max, p.token), 0) + 1;
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const newPatient = {
      id: `pat_${Date.now()}`,
      token: nextToken,
      name: name.trim(),
      age: parseInt(age, 10),
      gender,
      phone: phone || "Online Web",
      symptom: symptom || "General Consultation",
      shift,
      source: "Online",
      status: "waiting",
      time: timeStr,
      registeredAt: Date.now(),
      isEmergency: false,
      isReview: false,
      consultationFee: 600,
      vitals: { bp: "120/80", pulse: "72", temp: "98.6", spo2: "99", weight: "66" },
      diagnosis: "",
      prescription: [],
      labTests: [],
      advice: "",
      pharmacyStatus: "not_required",
      pharmacyTotal: 0
    };

    const updated = [...patients, newPatient];
    syncPatientsState(updated);

    setMySession(newPatient);
    localStorage.setItem('apex_my_session', JSON.stringify(newPatient));

    addAuditLog(`Token #${nextToken < 10 ? '0' + nextToken : nextToken} (${name}) booked online via patient website`, 'info');
    return newPatient;
  };

  // 9. Save Consultation (From Doctor Cabin -> Automatically pushes to In-House Pharmacy)
  const updatePatientConsultation = (patientId, { diagnosis, medicines, advice, reviewDays, labTests }) => {
    let updatedPat = null;
    const pricePerMed = 75; // average price estimate per medicine
    const medList = medicines || [];
    const totalPharm = medList.length * pricePerMed;

    const updated = patients.map(p => {
      if (p.id === patientId) {
        updatedPat = {
          ...p,
          diagnosis: diagnosis || p.diagnosis,
          prescription: medList,
          advice: advice || p.advice,
          reviewDays: reviewDays || "3",
          labTests: labTests || [],
          pharmacyStatus: medList.length > 0 ? 'pending' : 'not_required',
          pharmacyTotal: totalPharm
        };
        return updatedPat;
      }
      return p;
    });

    syncPatientsState(updated);
    if (updatedPat) {
      addAuditLog(`Dr. Rx saved for Token #${updatedPat.token} (${updatedPat.name}): ${medList.length} medicines sent to Pharmacy Counter`, 'success');
    }
  };

  // 10. Dispense medicines from Pharmacy Counter
  const dispensePharmacy = (patientId) => {
    let dispensedPat = null;
    const updated = patients.map(p => {
      if (p.id === patientId) {
        dispensedPat = p;
        return { ...p, pharmacyStatus: 'dispensed' };
      }
      return p;
    });
    syncPatientsState(updated);
    if (dispensedPat) {
      addAuditLog(`Pharmacy: Medicines dispensed & invoice generated for Token #${dispensedPat.token} (${dispensedPat.name})`, 'success');
    }
  };

  // 11. Reset Day for morning shift
  const resetDay = () => {
    if (confirm("Reset OPD Queue for a new morning shift?")) {
      setPatients(INITIAL_PATIENTS);
      localStorage.setItem('apex_patients_db', JSON.stringify(INITIAL_PATIENTS));
      broadcastEvent('SYNC_PATIENTS', INITIAL_PATIENTS);
      addAuditLog("OPD Shift reset for a new day", "info");
    }
  };

  return (
    <QueueContext.Provider
      value={{
        patients,
        currentPatient,
        servingToken,
        doctorStatus,
        setDoctorStatus: handleSetDoctorStatus,
        mySession,
        auditLogs,
        callPatient,
        callNextInLine,
        completePatient,
        skipPatient,
        emergencyBumpPatient,
        check7DayReview,
        addWalkInPatient,
        bookOnlineToken,
        updatePatientConsultation,
        dispensePharmacy,
        resetDay
      }}
    >
      {children}
    </QueueContext.Provider>
  );
}

              {/* Emergency & Review Flags */}

                  <span className="font-bold text-rose-700 inline-flex items-center gap-1.5">
                    <Icons.AlertTriangle className="w-3.5 h-3.5 text-rose-600" />
                    Mark as Emergency Patient (Priority #1 Triage)

                </label>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={walkInForm.isReview || !!reviewEligibility?.isEligible}
                    onChange={(e) => setWalkInForm({ ...walkInForm, isReview: e.target.checked })}

                  />
                  <span className="font-bold text-emerald-800 inline-flex items-center gap-1.5">
                    <Icons.RefreshCw className="w-3.5 h-3.5 text-emerald-600" />
                    7-Day Free Review Visit (Fee: ₹0)

                </label>
              </div>

              <div className="pt-2 flex gap-2">
                <button
                  type="button"
                  onClick={() => setShowWalkInModal(false)}
                  className="w-1/2 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="w-1/2 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold shadow-md shadow-teal-600/20 active:scale-95 transition-all"

            </form>
          </div>
        </div>
      )}

      {/* Official Doctor's OPD Prescription Slip Modal */}
      {printSlipPatient && (
        <OpdPrescriptionModal

      {/* 2-Inch Thermal POS Receipt Modal */}
      {printThermalPatient && (
        <ThermalTokenModal
          patient={printThermalPatient}
          onClose={() => setPrintThermalPatient(null)}
        />
      )}
    </div>
  );
}


    
/**

 * DOCTOR'S CABIN CONSULTATION TERMINAL (EMR DESK)
 * =========================================================================
 * Private dashboard for the doctor sitting inside the consultation room.
 * Displays compounder triage vitals, live queue, quick Rx writer, lab referrals,
 * and 1-click call next. Automatically syncs prescriptions to In-House Pharmacy.
 */

  const {
    patients, currentPatient, servingToken, doctorStatus, setDoctorStatus,
    callPatient, callNextInLine, completePatient, skipPatient,
    emergencyBumpPatient, updatePatientConsultation

  const [diagnosis, setDiagnosis] = useState('');

    { name: 'Tab. Paracetamol (Dolo) 650mg', dose: '1 - 0 - 1', timing: 'After Meals', duration: '3 Days', price: 35 },
    { name: 'Tab. Azithromycin 500mg', dose: '1 - 0 - 0', timing: 'After Breakfast', duration: '3 Days', price: 125 },
    { name: 'Tab. Pantoprazole 40mg', dose: '1 - 0 - 0', timing: 'Empty Stomach', duration: '5 Days', price: 80 }
  ]);
  const [customMed, setCustomMed] = useState({ name: '', dose: '1 - 0 - 1', timing: 'After Food', duration: '3 Days', price: 75 });
  const [reviewDays, setReviewDays] = useState('3');
  const [adviceNotes, setAdviceNotes] = useState('Drink plenty of warm water, soft diet, avoid cold items.');
  const [selectedLabTests, setSelectedLabTests] = useState(['CBC (Complete Blood Count & Platelets)']);

  const waitingPatients = patients.filter(p => p.status === 'waiting').sort((a, b) => {
    if (a.isEmergency && !b.isEmergency) return -1;
    if (!a.isEmergency && b.isEmergency) return 1;
    return a.token - b.token;
  });
  const completedPatients = patients.filter(p => p.status === 'completed');

  // Common clinical diagnostic presets for quick 1-click selection
  const commonDiagnoses = [
    'Viral URTI / Pharyngitis',
    'Acute Bronchitis & Cough',
    'Seasonal Pyrexia (Fever)',
    'Hypertension (Stage 1)',
    'Acute Gastritis / GERD',
    'Type 2 Diabetes Follow-up',
    'Migraine / Tension Headache'
  ];

  // Quick medicine presets
  const quickMedPresets = [
    { name: 'Tab. Dolo 650mg', dose: '1 - 0 - 1', timing: 'After Meals', duration: '3 Days', price: 35 },
    { name: 'Tab. Augmentin 625mg', dose: '1 - 0 - 1', timing: 'After Food', duration: '5 Days', price: 195 },
    { name: 'Tab. Pan-40mg', dose: '1 - 0 - 0', timing: 'Empty Stomach', duration: '5 Days', price: 80 },
    { name: 'Syp. Ascoril-D', dose: '10ml - 10ml - 10ml', timing: 'After Food (TDS)', duration: '5 Days', price: 110 },
    { name: 'Tab. Montair-LC', dose: '0 - 0 - 1', timing: 'At Bedtime', duration: '5 Days', price: 95 },
    { name: 'Electral ORS Sachet', dose: '1 Sachet in 1L Water', timing: 'Sip Throughout Day', duration: '2 Days', price: 25 }
  ];

  const commonLabPresets = [
    'CBC (Complete Blood Count & Platelets)',
    'Blood Sugar - Fasting (FBS)',
    'Lipid Profile',
    'Serum Creatinine',
    'Liver Function Test (LFT)',
    'Urine Routine (R/M)',
    'Chest X-Ray (PA View)',
    'ECG 12-Lead'
  ];

  const handleAddPreset = (med) => {
    if (!medicines.some(m => m.name === med.name)) {
      setMedicines([...medicines, med]);
    }
  };

  const handleAddCustomMed = (e) => {
    e.preventDefault();
    if (!customMed.name.trim()) return;
    setMedicines([...medicines, customMed]);
    setCustomMed({ name: '', dose: '1 - 0 - 1', timing: 'After Food', duration: '3 Days', price: 75 });
  };

  const handleRemoveMed = (index) => {
    setMedicines(medicines.filter((_, i) => i !== index));
  };

  const toggleLabTest = (testName) => {
    if (selectedLabTests.includes(testName)) {
      setSelectedLabTests(selectedLabTests.filter(t => t !== testName));
    } else {
      setSelectedLabTests([...selectedLabTests, testName]);
    }
  };

  const handleCompleteAndNext = () => {
    if (currentPatient) {
      updatePatientConsultation(currentPatient.id, {
        diagnosis: diagnosis || currentPatient.symptom || 'General Consultation',
        medicines,
        advice: adviceNotes,
        reviewDays,
        labTests: selectedLabTests
      });
      completePatient(currentPatient.id);
    }
    callNextInLine();
  };

  // Vitals of current patient or defaults

    bp: '120/80',

    temp: '98.6',
    spo2: '99',
    weight: '68'
  };

/**
 * =========================================================================
 * PATHOLOGY & DIAGNOSTIC LAB REQUISITION SLIP (जांच पर्ची)
 * =========================================================================
 * Used by Doctor to recommend blood tests, radiology, or ECG.
 * Printable as an official lab referral slip.
 */
function LabRequisitionModal({ patient, initialTests = [], diagnosis = '', onClose }) {
  if (!patient) return null;
  const doctor = CLINIC_CONFIG.doctor;
  const todayStr = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

  // Standard OPD Clinical Lab Test Categories
  const standardTests = [
    { name: 'CBC (Complete Blood Count & Platelets)', cat: 'Hematology' },
    { name: 'Blood Sugar - Fasting (FBS)', cat: 'Biochemistry' },
    { name: 'Blood Sugar - Post Prandial (PPBS)', cat: 'Biochemistry' },
    { name: 'HbA1c (Glycated Hemoglobin)', cat: 'Biochemistry' },
    { name: 'Lipid Profile (Cholesterol & Triglycerides)', cat: 'Biochemistry' },
    { name: 'Liver Function Test (LFT)', cat: 'Biochemistry' },
    { name: 'Kidney Function Test / Serum Creatinine', cat: 'Biochemistry' },
    { name: 'Serum Uric Acid', cat: 'Biochemistry' },
    { name: 'Thyroid Profile (T3, T4, TSH)', cat: 'Endocrine' },
    { name: 'Widal Test (Typhoid Slide)', cat: 'Serology' },
    { name: 'Dengue NS1 Antigen & Antibody', cat: 'Serology' },
    { name: 'Malaria Antigen Card Test', cat: 'Serology' },
    { name: 'Urine Routine & Microscopy (R/M)', cat: 'Urine' },
    { name: 'Chest X-Ray (PA View)', cat: 'Radiology' },
    { name: 'ECG 12-Lead (Electrocardiogram)', cat: 'Cardiology' }
  ];

  const [selectedTests, setSelectedTests] = useState(
    initialTests.length > 0 ? initialTests : ['CBC (Complete Blood Count & Platelets)', 'Blood Sugar - Fasting (FBS)']
  );
  const [customTest, setCustomTest] = useState('');

  const toggleTest = (testName) => {
    if (selectedTests.includes(testName)) {
      setSelectedTests(selectedTests.filter(t => t !== testName));
    } else {
      setSelectedTests([...selectedTests, testName]);
    }
  };

  const handleAddCustom = (e) => {
    e.preventDefault();
    if (!customTest.trim()) return;
    if (!selectedTests.includes(customTest.trim())) {
      setSelectedTests([...selectedTests, customTest.trim()]);
    }
    setCustomTest('');
  };

  const handlePrint = () => {
    window.print();
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
      <div className="bg-white rounded-3xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden my-auto flex flex-col">
        {/* Modal Controls Header */}
        <div className="no-print bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <Icons.Flask className="w-5 h-5 text-teal-300" />
            <div>
              <h3 className="font-display font-bold text-sm text-white">Lab & Diagnostic Investigation Requisition</h3>
              <p className="text-[11px] text-slate-400">Pathology & Radiology Referral Slip (जांच पर्ची)</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button
              onClick={handlePrint}

/**
 * =========================================================================
 * IN-HOUSE MEDICAL STORE & PHARMACY DESK (दवाई काउंटर मॉड्यूल)
 * =========================================================================
 * Receives live prescriptions from Doctor Cabin, calculates bill, allows
 * pharmacist to mark dispensed, and prints an authentic pharmacy cash memo.
 */
function PharmacyDesk({ onExit, onOpenDoctor, onOpenCompounder }) {
  const { patients, dispensePharmacy } = useQueue();
  const doctor = CLINIC_CONFIG.doctor;

  const [activeTab, setActiveTab] = useState('pending'); // 'pending' | 'dispensed' | 'all'
  const [searchTerm, setSearchTerm] = useState('');
  const [printInvoicePatient, setPrintInvoicePatient] = useState(null);

  // Filter patients that have a prescription
  const rxPatients = patients.filter(p => p.prescription && p.prescription.length > 0);

  const filteredPatients = rxPatients.filter(p => {
    const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                          p.token.toString() === searchTerm.trim() ||
                          (p.phone && p.phone.includes(searchTerm.trim()));
    if (activeTab === 'pending') return matchesSearch && p.pharmacyStatus === 'pending';
    if (activeTab === 'dispensed') return matchesSearch && p.pharmacyStatus === 'dispensed';
    return matchesSearch;
  });

  const pendingCount = rxPatients.filter(p => p.pharmacyStatus === 'pending').length;
  const dispensedCount = rxPatients.filter(p => p.pharmacyStatus === 'dispensed').length;
  const totalPharmacyRevenue = rxPatients
    .filter(p => p.pharmacyStatus === 'dispensed')
    .reduce((sum, p) => sum + (p.pharmacyTotal || 0), 0);

  const handleDispense = (patientId) => {
    dispensePharmacy(patientId);
  };

  return (
    <div className="max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-6">

          <div className="w-12 h-12 rounded-2xl bg-amber-500/20 text-amber-300 flex items-center justify-center font-black text-2xl border border-amber-500/30">
            <Icons.Pill className="w-6 h-6 text-amber-400" />
          </div>
          <div>
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span className="text-xs font-mono font-bold uppercase tracking-widest text-amber-300">
                In-House Medical Store & Pharmacy Desk (दवाई काउंटर)
              </span>
            </div>
            <h2 className="text-xl sm:text-2xl font-display font-black text-white mt-0.5">
              {doctor.clinicName} &bull; Pharmacy Counter

          </div>
        </div>

        <div className="flex items-center gap-2 flex-wrap">
          {onOpenDoctor && (
            <button
              onClick={onOpenDoctor}

              <Icons.Stethoscope className="w-3.5 h-3.5" /> Doctor Cabin

            <button

            >

          )}

              <Icons.X className="w-3.5 h-3.5" /> Exit Desk

          <button
            onClick={() => setActiveTab('all')}

        <div className="w-full sm:w-72">

                    <span className="text-slate-300">|</span>
                    <span className="text-xs text-slate-700 font-bold">Total Bill: <span className="font-display text-lg text-emerald-700 font-black">₹{totalBill}</span></span>

      {printInvoicePatient && (
        <PharmacyInvoiceModal

          onClose={() => setPrintInvoicePatient(null)}

    </div>
  );

/**
 * =========================================================================
 * DAILY OPD REGISTER & ACCOUNTS / BILLING SUMMARY (दैनिक ओपीडी बहीखाता)
 * =========================================================================
 * Essential for clinic shift accounting, total fee collections, and legal OPD records.
 * Supports 1-click CSV/Excel export and official accounting print format.
 */
function DailyOpdRegister({ onExit, onOpenTv }) {
  const { patients } = useQueue();
  const doctor = CLINIC_CONFIG.doctor;

  const todayStr = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  const feePerPatient = parseInt(doctor.consultationFee?.replace(/\D/g, '') || '600', 10);

  // Filter state
  const [filterSource, setFilterSource] = useState('all'); // 'all' | 'Walk-In' | 'Online'
  const [searchTerm, setSearchTerm] = useState('');

  // Payment statuses stored locally or derived
  const [payments, setPayments] = useState(() => {
    // Default initial mock payments
    const init = {};
    patients.forEach((p, idx) => {
      init[p.id] = idx % 2 === 0 ? 'Cash' : 'UPI';
    });
    return init;
  });

  const handleTogglePayment = (patientId) => {
    setPayments(prev => ({
      ...prev,
      [patientId]: prev[patientId] === 'Cash' ? 'UPI' : prev[patientId] === 'UPI' ? 'Cash' : 'UPI'
    }));
  };

  const filtered = patients.filter(p => {
    const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.token.toString() === searchTerm.trim();
    if (filterSource === 'all') return matchesSearch;
    return matchesSearch && p.source === filterSource;
  });

  // Financial calculations
  const totalRegistered = patients.length;
  const completedCount = patients.filter(p => p.status === 'completed').length;
  const totalRevenue = totalRegistered * feePerPatient;
  const cashPatients = patients.filter(p => (payments[p.id] || 'Cash') === 'Cash').length;
  const upiPatients = totalRegistered - cashPatients;
  const cashRevenue = cashPatients * feePerPatient;
  const upiRevenue = upiPatients * feePerPatient;

  // Export to CSV / Excel
  const handleExportCsv = () => {
    const headers = ["Token", "Time", "Patient Name", "Age", "Gender", "Phone", "Concern/Symptom", "Booking Type", "Status", "Fee (INR)", "Payment Mode"];
    const rows = patients.map((p, idx) => [
      `#${p.token < 10 ? '0' + p.token : p.token}`,
      p.time || '10:00 AM',
      `"${p.name}"`,
      p.age,
      p.gender,
      p.phone || 'N/A',
      `"${p.symptom || 'General OPD'}"`,
      p.source,
      p.status,
      feePerPatient,
      payments[p.id] || 'Cash'
    ]);

    const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `OPD_Register_${doctor.clinicName.replace(/\s+/g, '_')}_${todayStr.replace(/\s+/g, '_')}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const handlePrint = () => {
    window.print();
  };

  return (
    <div className="max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-6">
      {/* Top Header */}
      <div className="no-print bg-hospital-navy text-white rounded-3xl p-6 shadow-xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
        <div>
          <div className="flex items-center gap-2">
            <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span className="text-xs font-mono font-bold uppercase tracking-widest text-teal-300">
              Daily OPD Register & Accounts Ledger (दैनिक बहीखाता)
            </span>
          </div>
          <h2 className="text-xl sm:text-2xl font-display font-black text-white mt-0.5">
            {doctor.clinicName} &bull; <span className="text-emerald-400">{todayStr}</span>
          </h2>
        </div>

        <div className="flex items-center gap-2.5">
          <button
            onClick={handleExportCsv}
            className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-1.5 shadow-md transition-all"
          >
            <Icons.Download className="w-3.5 h-3.5" /> Export CSV
          </button>
          <button
            onClick={handlePrint}
            className="bg-slate-800 hover:bg-slate-700 text-teal-300 px-4 py-2.5 rounded-xl text-xs font-bold border border-slate-700 flex items-center gap-1.5 shadow-md"
          >
            <Icons.Printer className="w-3.5 h-3.5" /> Print Daily Register
          </button>
          <button
            onClick={onExit}
            className="bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-300 px-3.5 py-2.5 rounded-xl text-xs font-semibold border border-slate-700 flex items-center gap-1"
          >
            <Icons.X className="w-3.5 h-3.5" /> Close
          </button>
        </div>
      </div>

      {/* Financial & Operational KPI Cards */}
      <div className="no-print grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <p className="text-[11px] font-bold uppercase tracking-wider text-slate-500">Total Patients</p>
          <p className="font-display font-black text-3xl text-slate-900 mt-1">{totalRegistered}</p>
          <p className="text-[10px] text-slate-400 mt-1">{completedCount} Completed &bull; {totalRegistered - completedCount} Waiting</p>
        </div>

        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <p className="text-[11px] font-bold uppercase tracking-wider text-emerald-700">Total Fee Collection</p>
          <p className="font-display font-black text-3xl text-emerald-700 mt-1">₹{totalRevenue.toLocaleString('en-IN')}</p>
          <p className="text-[10px] text-slate-400 mt-1">At {doctor.consultationFee || '₹600'} per patient</p>
        </div>

        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">

          <p className="text-[10px] text-slate-400 mt-1">{cashPatients} Patients Paid Cash</p>
        </div>

        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <p className="text-[11px] font-bold uppercase tracking-wider text-teal-700">Online / UPI Collection</p>
          <p className="font-display font-black text-3xl text-teal-700 mt-1">₹{upiRevenue.toLocaleString('en-IN')}</p>
          <p className="text-[10px] text-slate-400 mt-1">{upiPatients} Patients Paid UPI / QR</p>
        </div>
      </div>

      {/* Main Register Table (Visible on Screen & Prints Official Report) */}
      <div id="printable-daily-register" className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden p-6">
        {/* Printable Letterhead (Shown in Print Mode) */}
        <div className="hidden print:block pb-4 mb-4 border-b-2 border-slate-900">
          <div className="flex justify-between items-start">
            <div>
              <h1 className="font-black text-xl text-slate-900 uppercase">{doctor.clinicName}</h1>
              <p className="text-xs text-slate-600">{doctor.address}, {doctor.city} &bull; Ph: {doctor.helplinePhone}</p>
              <h2 className="text-sm font-bold text-slate-900 mt-1">DAILY OPD PATIENT REGISTER & FEE COLLECTION LEDGER</h2>
            </div>
            <div className="text-right text-xs">
              <p><b>Date:</b> {todayStr}</p>
              <p><b>Doctor:</b> {doctor.name} ({doctor.regNo})</p>
              <p><b>Total Collection:</b> ₹{totalRevenue.toLocaleString('en-IN')}</p>
            </div>
          </div>
        </div>

        {/* Screen Controls */}
        <div className="no-print pb-4 mb-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
          <div className="flex bg-slate-100 p-1 rounded-xl text-xs">
            <button
              onClick={() => setFilterSource('all')}
              className={`px-3 py-1.5 rounded-lg font-bold transition-all ${filterSource === 'all' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600'}`}
            >
              All ({totalRegistered})
            </button>
            <button
              onClick={() => setFilterSource('Walk-In')}

              Walk-Ins Only

            <button

              Online Portal Bookings
            </button>
          </div>

          <div className="flex items-center gap-2">
            <input
              type="text"

              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}

function TokenBooking() {
  const { bookOnlineToken, check7DayReview } = useQueue();
  const doctor = CLINIC_CONFIG.doctor;

  const todayStr = new Date().toISOString().split('T')[0];
  const tomorrowObj = new Date();
  tomorrowObj.setDate(tomorrowObj.getDate() + 1);
  const tomorrowStr = tomorrowObj.toISOString().split('T')[0];

  const [selectedDate, setSelectedDate] = useState(todayStr);
  const [selectedShift, setSelectedShift] = useState('Morning (10:00 AM - 01:30 PM)');
  const [visitType, setVisitType] = useState('fresh'); // 'fresh' | 'review'

  const [formData, setFormData] = useState({
    name: '',
    age: '',
    gender: 'Male',
    phone: '',
    symptom: ''
  });

  const [confirmedPatient, setConfirmedPatient] = useState(null);
  const [showOpdModal, setShowOpdModal] = useState(false);
  const [showThermalModal, setShowThermalModal] = useState(false);

  // Check 7-day review auto-match
  const reviewMatch = formData.phone ? check7DayReview(formData.phone) : null;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!formData.name.trim() || !formData.age) return;

    const isReview = visitType === 'review' || !!reviewMatch?.isEligible;

    const booked = bookOnlineToken({
      name: formData.name,
      age: formData.age,
      gender: formData.gender,
      phone: formData.phone,
      symptom: formData.symptom || 'General Consultation',
      shift: selectedShift,
      isReview
    });

    setConfirmedPatient(booked);

    // Direct WhatsApp message formatting
    const tokenFormatted = booked.token < 10 ? `0${booked.token}` : booked.token;
    const message = `*CLINICAL APPOINTMENT & OPD BOARDING PASS*\n\n` +
                    `*Chamber:* ${doctor.clinicName}\n` +
                    `*Physician:* ${doctor.name} (${doctor.degree})\n` +
                    `*Reg. No:* ${doctor.regNo}\n` +
                    `*Allocated Token:* #${tokenFormatted}\n` +

                    `*Consultation Shift:* ${selectedShift}\n` +
                    `*Category:* ${isReview ? '7-Day Free Follow-Up Review (₹0)' : `Fresh Consultation (${doctor.consultationFee})`}\n` +
                    `*Chamber Address:* ${doctor.address}\n\n` +
                    `_Please arrive 10 minutes prior to shift window. Present token #${tokenFormatted} at reception desk._`;

    const url = `https://wa.me/${doctor.whatsappNumber}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');

  const activeTokenNum = confirmedPatient ? confirmedPatient.token : 6;
  const isConfirmed = !!confirmedPatient;

  const displayPatient = confirmedPatient || {

    shift: selectedShift,
    isReview: visitType === 'review' || !!reviewMatch?.isEligible

  return (
    <div className="bg-white rounded-3xl shadow-xl shadow-slate-900/5 border border-slate-200/90 overflow-hidden">

  // Live ticking clock for workers
  useEffect(() => {
    const updateTime = () => {
      setCurrentTimeStr(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    };
    updateTime();
    const timer = setInterval(updateTime, 1000);
    return () => clearInterval(timer);
  }, []);

  // URL query parameter routing (?desk=true, ?doctor=true, ?pharmacy=true, ?tv=true)
  useEffect(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get('desk') === 'true' || params.get('view') === 'compounder') {
        setCurrentView('compounder');
      } else if (params.get('doctor') === 'true' || params.get('view') === 'doctor') {
        setCurrentView('doctor');
      } else if (params.get('pharmacy') === 'true' || params.get('view') === 'pharmacy') {
        setCurrentView('pharmacy');
      } else if (params.get('register') === 'true' || params.get('view') === 'daily_register') {
        setCurrentView('daily_register');
      } else if (params.get('tv') === 'true' || params.get('view') === 'tv_display') {
        setCurrentView('tv_display');
      }
      if (params.get('demo') === 'true') {
        setIsDemoMode(true);
      }
    } catch (e) {
      console.warn('URL param parse notice:', e);

      {/* =============================================================== */}
      {currentView === 'pharmacy' && (
        <main className="flex-1 w-full p-4 sm:p-6">
          <PharmacyDesk
            onExit={() => setCurrentView('patient')}
            onOpenDoctor={() => setCurrentView('doctor')}
            onOpenCompounder={() => setCurrentView('compounder')}
          />
        </main>
      )}

      {/* =============================================================== */}
      {/* VIEW 4: DAILY OPD REGISTER & ACCOUNTS SUMMARY                    */}
      {/* =============================================================== */}
      {currentView === 'daily_register' && (
        <main className="flex-1 w-full p-4 sm:p-6">
          <DailyOpdRegister
            onExit={() => setCurrentView('patient')}
            onOpenTv={() => setCurrentView('tv_display')}
          />
        </main>
      )}

      {/* =============================================================== */}
      {/* VIEW 5: PUBLIC PATIENT WEBSITE (Fast, Editorial, Trustworthy)    */}
      {/* =============================================================== */}
      {currentView === 'patient' && (
        <main className="flex-1">
          {/* Doctor Chamber Hero */}
          <DoctorHeader onBookClick={scrollToToken} />

          {/* Live Patient Turn Tracker Card */}
          <section className="max-w-5xl mx-auto px-4 -mt-8 sm:-mt-10 relative z-20">
            <LiveQueueTracker />
          </section>

          {/* Clinical Focus Areas & Practice Standards */}
          <section className="mt-8">
            <DoctorPromises />
          </section>

          {/* Token Booking & Pass Section */}
          <section ref={tokenSectionRef} className="max-w-5xl mx-auto px-4 py-12 scroll-mt-6">
            <TokenBooking />
          </section>

          {/* Clinic Location & Timings */}
          <section className="bg-white border-t border-slate-200/80 py-12">
            <LocationAndHours onScrollToToken={scrollToToken} />
          </section>
        </main>
      )}

      {/* Institutional Clinic Footer */}
      <footer className="no-print py-12 px-6 bg-slate-900 text-slate-400 text-center text-xs mt-auto border-t border-slate-800">
        <div className="max-w-5xl mx-auto space-y-2">
          <p className="font-display font-bold text-white text-base">
            {doctor.clinicName} &bull; {doctor.name}
          </p>
          <p className="text-[11px] text-slate-400">
            {doctor.degree} &bull; NMC License Reg. #{doctor.regNo} &bull; Ambulatory Outpatient Medicine Chamber
          </p>
          <p className="text-[10px] text-slate-500 max-w-xl mx-auto leading-relaxed pt-1">
            Compliant with clinical governance guidelines. All patient clinical notes, triage vitals, and diagnostic referrals are confidential medical records.
          </p>
        </div>
        
        <div className="mt-8 pt-6 border-t border-slate-800 flex flex-wrap items-center justify-between max-w-5xl mx-auto text-[11px] text-slate-500 gap-3">
          <span>&copy; {new Date().getFullYear()} {doctor.clinicName}. Authorized Healthcare Chamber.</span>
          
          <div className="flex items-center gap-4 flex-wrap">
            <button
              onClick={() => setIsDemoMode(prev => !prev)}
              className="text-slate-500 hover:text-slate-300 transition-colors"
            >
              Staff Switcher Bar
            </button>
            <button
              onClick={() => setCurrentView('tv_display')}
              className="text-slate-400 hover:text-white flex items-center gap-1.5 transition-colors font-medium"
            >
              <Icons.Tv className="w-3.5 h-3.5" />
              <span>TV OPD Display</span>
            </button>
            <button
              onClick={() => setCurrentView('pharmacy')}
              className="text-slate-400 hover:text-white flex items-center gap-1.5 transition-colors font-medium"
            >
              <Icons.Pill className="w-3.5 h-3.5" />
              <span>Pharmacy Counter</span>
            </button>
            <button
              onClick={() => setShowPinModal(true)}
              className="text-slate-400 hover:text-emerald-400 flex items-center gap-1.5 transition-colors font-medium"
            >
              <Icons.Lock className="w-3.5 h-3.5" />
              <span>Staff Chamber Login</span>
            </button>
          </div>
        </div>
      </footer>

      {/* Staff PIN Login Modal */}
      {showPinModal && (
        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl border border-slate-100 text-center">
            <div className="w-12 h-12 rounded-2xl bg-slate-100 text-slate-700 flex items-center justify-center text-xl mx-auto mb-4">
              <Icons.Lock className="w-5 h-5 text-slate-800" />
            </div>
            <h3 className="font-display font-bold text-lg text-slate-900 mb-1">
              Staff Chamber Access
            </h3>
            <p className="text-xs text-slate-500 mb-5 font-light">
              Enter 4-digit staff PIN to unlock reception, doctor, or pharmacy terminal:
            </p>

            <form onSubmit={handlePinSubmit} className="space-y-4">
              <div>
                <input
                  type="password"
                  maxLength={6}
                  autoFocus
                  placeholder="PIN (Default: 1234)"
                  value={pinInput}
                  onChange={(e) => {
                    setPinInput(e.target.value);
                    setPinError(false);
                  }}
                  className={`w-full text-center tracking-[0.5em] text-lg font-bold bg-slate-50 border rounded-xl py-3 text-slate-900 focus:outline-none ${
                    pinError ? 'border-rose-500 bg-rose-50/50' : 'border-slate-200 focus:border-slate-900'
                  }`}
                />
                {pinError && (
                  <p className="text-[11px] text-rose-500 mt-1.5 font-medium">
                    Incorrect PIN. Default is {CLINIC_CONFIG.staff.pin}
                  </p>
                )}
              </div>

              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => {
                    setShowPinModal(false);
                    setPinInput('');
                    setPinError(false);
                  }}
                  className="w-1/2 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="w-1/2 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-md"
                >
                  Unlock Workspace
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

    </div>
  );
}


    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(
      <QueueProvider>
        <App />
      </QueueProvider>
    );
  </script>
</body>
</html>
